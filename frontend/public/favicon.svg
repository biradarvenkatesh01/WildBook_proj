<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Forest Squircle Background with Amber Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#163522" stroke="#D9A441" stroke-width="2.5"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="#11291A" opacity="0.45"/>
  
  <!-- WildBook Iconic Leaf & Book Mark -->
  <g transform="translate(5, 5) scale(1.125)">
    <!-- Leaf Silhouette / Book Open Page -->
    <path d="M24 5C24 5 9 14.5 9 28C9 36.5 15.8 43 24 43C32.2 43 39 36.5 39 28C39 14.5 24 5 24 5Z" 
          fill="#F6F1E7" fill-opacity="0.22" 
          stroke="#F6F1E7" stroke-width="2.8" stroke-linejoin="round"/>
    
    <!-- Central Golden Spine -->
    <line x1="24" y1="6" x2="24" y2="43" stroke="#D9A441" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Botanical Vein / Page Lines -->
    <path d="M24 16 L15 22.5" stroke="#F6F1E7" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M24 23 L33 29.5" stroke="#F6F1E7" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M24 30 L15 36.5" stroke="#F6F1E7" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.95"/>
    
    <!-- Golden Apex Crown Jewel -->
    <circle cx="24" cy="6" r="3.2" fill="#D9A441" stroke="#163522" stroke-width="1"/>
  </g>
</svg>